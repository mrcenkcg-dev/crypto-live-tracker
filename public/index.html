<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Engine - Launch Portal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        h1 { color: #38bdf8; text-align: center; }
        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
        }
        .nav-tabs button {
            background: #334155;
            color: #f8fafc;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .nav-tabs button.active { background: #0284c7; }
        .portal-section {
            display: none;
            background: #334155;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 25px;
        }
        .portal-section.active { display: block; }
        input, button.action-btn {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border-radius: 6px;
            border: none;
            font-size: 16px;
            box-sizing: border-box;
        }
        input { background: #1e293b; color: #fff; }
        button.action-btn { background: #0284c7; color: #fff; font-weight: bold; cursor: pointer; }
        button.action-btn:hover { background: #0369a1; }
        .logout-btn { background: #ef4444 !important; margin-top: 15px; }
        .slot-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 10px;
            margin-top: 20px;
        }
        .slot {
            background: #475569;
            padding: 15px;
            text-align: center;
            border-radius: 6px;
            font-size: 14px;
        }
        .slot.active { background: #0284c7; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Community Engine Portal</h1>
        <p style="text-align: center; color: #94a3b8;">Fair rotation network: Max 10 active slots per participant.</p>

        <!-- Role Selector Tabs -->
        <div class="nav-tabs" id="navTabs">
            <button id="btnBusiness" class="active" onclick="switchPortal('business')">Business / Slot Owner</button>
            <button id="btnClicker" onclick="switchPortal('clicker')">Clicker Community Member</button>
        </div>

        <!-- Business Portal Section -->
        <div id="businessPortal" class="portal-section active">
            <h3>Business Slot Registration</h3>
            <div id="bizFormArea">
                <input type="text" id="bizName" placeholder="Enter Business Name" required>
                <input type="number" id="slotCount" min="1" max="10" placeholder="Number of slots (Max 10)" required>
                <button class="action-btn" onclick="registerBusiness()">Save & Go Online</button>
            </div>
            <div id="bizSessionArea" style="display:none;">
                <p>Status: <strong style="color: #34d399;">ONLINE (Active Dispatcher)</strong></p>
                <p>Logged in as: <span id="displayBizName" style="color: #38bdf8; font-weight: bold;"></span></p>
                <button class="action-btn logout-btn" onclick="logout('business')">Log Out / Switch</button>
            </div>
            <p id="bizNotice" style="margin-top: 10px; font-size: 14px; color: #38bdf8;"></p>
        </div>

        <!-- Clicker Community Portal Section -->
        <div id="clickerPortal" class="portal-section">
            <h3>Clicker Community Portal</h3>
            <div id="clickerFormArea">
                <input type="text" id="clickerName" placeholder="Enter Your Name / Handle" required>
                <button class="action-btn" onclick="registerClicker()">Start Daily Rotation Task</button>
            </div>
            <div id="clickerSessionArea" style="display:none;">
                <p>Status: <strong style="color: #34d399;">ONLINE (Ready for A-to-B Routing)</strong></p>
                <p>Courier: <span id="displayClickerName" style="color: #38bdf8; font-weight: bold;"></span></p>
                <button class="action-btn" onclick="simulateTaskCompletion()" style="background: #10b981;">Complete Today's Task</button>
                <button class="action-btn logout-btn" onclick="logout('clicker')">Log Out / Switch</button>
            </div>
            <p id="clickerNotice" style="margin-top: 10px; font-size: 14px; color: #34d399;"></p>
        </div>

        <h3>Active Network Overview</h3>
        <div class="slot-grid" id="slotContainer">
            <!-- Dynamic items populated here -->
        </div>
    </div>

    <script>
        const CONFIG = {
            maxFreeSlots: 1500,
            microFeeEntry: 0.50,
            userSlotLimit: 10,
            testWindowDays: 7
        };

        window.onload = function() {
            checkSavedSessions();
        };

        function switchPortal(portalType) {
            const bizTab = document.getElementById('btnBusiness');
            const clickerTab = document.getElementById('btnClicker');
            const bizSection = document.getElementById('businessPortal');
            const clickerSection = document.getElementById('clickerPortal');

            if (portalType === 'business') {
                bizTab.classList.add('active');
                clickerTab.classList.remove('active');
                bizSection.classList.add('active');
                clickerSection.classList.remove('active');
            } else {
                clickerTab.classList.add('active');
                bizTab.classList.remove('active');
                clickerSection.classList.add('active');
                bizSection.classList.remove('active');
            }
        }

        function registerBusiness() {
            const name = document.getElementById('bizName').value;
            const slots = parseInt(document.getElementById('slotCount').value);
            if (!name || isNaN(slots) || slots < 1 || slots > CONFIG.userSlotLimit) {
                alert("Please enter a valid business name and 1-10 slots.");
                return;
            }
            localStorage.setItem('engine_biz_name', name);
            localStorage.setItem('engine_biz_slots', slots);
            loadBizSession(name, slots);
            renderSlots(name, slots);
        }

        function registerClicker() {
            const name = document.getElementById('clickerName').value;
            if (!name) {
                alert("Please enter your name or handle.");
                return;
            }
            localStorage.setItem('engine_clicker_name', name);
            loadClickerSession(name);
        }

        function loadBizSession(name, slots) {
            document.getElementById('bizFormArea').style.display = 'none';
            document.getElementById('bizSessionArea').style.display = 'block';
            document.getElementById('displayBizName').innerText = name + ` (${slots} slots)`;
            renderSlots(name, slots);
        }

        function loadClickerSession(name) {
            document.getElementById('clickerFormArea').style.display = 'none';
            document.getElementById('clickerSessionArea').style.display = 'block';
            document.getElementById('displayClickerName').innerText = name;
            document.getElementById('clickerNotice').innerText = "You are online and ready to route traffic!";
        }

        function simulateTaskCompletion() {
            alert("Task completed successfully! Rotation verified for today.");
        }

        function logout(type) {
            if (type === 'business') {
                localStorage.removeItem('engine_biz_name');
                localStorage.removeItem('engine_biz_slots');
                document.getElementById('bizFormArea').style.display = 'block';
                document.getElementById('bizSessionArea').style.display = 'none';
                document.getElementById('bizName').value = '';
                document.getElementById('slotCount').value = '';
                renderSlots("Sample Partner", 3);
            } else {
                localStorage.removeItem('engine_clicker_name');
                document.getElementById('clickerFormArea').style.display = 'block';
                document.getElementById('clickerSessionArea').style.display = 'none';
                document.getElementById('clickerName').value = '';
                document.getElementById('clickerNotice').innerText = '';
            }
        }

        function checkSavedSessions() {
            const savedBiz = localStorage.getItem('engine_biz_name');
            const savedSlots = localStorage.getItem('engine_biz_slots');
            if (savedBiz && savedSlots) {
                loadBizSession(savedBiz, parseInt(savedSlots));
            } else {
                renderSlots("Sample Partner", 3);
            }

            const savedClicker = localStorage.getItem('engine_clicker_name');
            if (savedClicker) {
                loadClickerSession(savedClicker);
            }
        }

        function renderSlots(ownerName, count) {
            const container = document.getElementById('slotContainer');
            container.innerHTML = '';
            for (let i = 1; i <= count; i++) {
                const div = document.createElement('div');
                div.className = 'slot active';
                div.innerHTML = `<strong>${ownerName}</strong><br>Slot #${i} (Live)`;
                container.appendChild(div);
            }
        }
    </script>

</body>
</html>
