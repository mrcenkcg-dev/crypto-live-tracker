<script>
    // Fetch and display live cards from server.js
    async function loadBoardCards() {
        try {
            const response = await fetch('/api/cards');
            const cards = await response.json();
            const grid = document.querySelector('.grid');
            
            if (cards && cards.length > 0) {
                grid.innerHTML = cards.map(card => `
                    <div class="sticky-card ${card.type === 'system' ? 'system' : ''}">
                        <span class="card-type ${card.type === 'system' ? 'type-system' : 'type-reach'}">
                            ${card.type === 'system' ? 'System Provider' : 'Social Reach'}
                        </span>
                        <div class="card-title">${card.name}</div>
                        <div class="card-meta">${card.meta}</div>
                        <div class="card-reach">${card.reach}</div>
                        <a href="${card.link}" target="_blank" style="text-decoration: none;">
                            <button class="link-btn">Link Up</button>
                        </a>
                    </div>
                `).join('');
            }
        } catch (err) {
            console.error('Error loading cards:', err);
        }
    }

    loadBoardCards();
</script>
