<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anadolu Island - Short-Form Stream</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0b0b;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .short-stream-container {
            width: 100%;
            max-width: 400px;
            height: 85vh;
            background: #141414;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid #262626;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .stream-header {
            padding: 16px;
            border-bottom: 1px solid #222;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #181818;
        }
        .brand-title {
            font-weight: 700;
            font-size: 15px;
            letter-spacing: 1.5px;
        }
        .live-badge {
            font-size: 10px;
            font-weight: 700;
            background: #ff3b30;
            color: #ffffff;
            padding: 3px 8px;
            border-radius: 4px;
            letter-spacing: 0.5px;
        }
        .video-viewport {
            flex: 1;
            background: #1c1c1c;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .feed-status {
            text-align: center;
            color: #888;
        }
        .feed-status p {
            margin: 4px 0;
        }
        .action-bar {
            position: absolute;
            right: 16px;
            bottom: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            align-items: center;
        }
        .action-btn {
            background: rgba(0, 0, 0, 0.6);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>

    <div class="short-stream-container">
        <!-- Header -->
        <div class="stream-header">
            <span class="brand-title">ANADOLU SHORTS</span>
            <span class="live-badge">LIVE</span>
        </div>
        
        <!-- Viewport -->
        <div class="video-viewport">
            <div class="feed-status">
                <p style="font-size: 16px; color: #fff; font-weight: 500;">Stream Feed Active</p>
                <p style="font-size: 12px;">Autonomous Indexer Connected</p>
            </div>
            
            <!-- Side Actions -->
            <div class="action-bar">
                <div class="action-btn" title="Like">❤️</div>
                <div class="action-btn" title="Comments">💬</div>
                <div class="action-btn" title="Share">🔗</div>
            </div>
        </div>
    </div>

</body>
</html>
