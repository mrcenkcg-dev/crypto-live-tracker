<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Big Together Hub</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 20px auto; padding: 20px; background: #f4f4f9; color: #333; }
        .card { background: white; padding: 15px; margin-bottom: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        button { background: #007bff; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:hover { background: #0056b3; }
        input, select { width: 100%; padding: 8px; margin: 5px 0 15px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>Get Big Together Hub</h1>
    <p>Simple Handshake Hub — Share Links & Grow Reach with Absolute Trust.</p>

    <div class="card">
        <h3>Post Your Offer</h3>
        <form action="/add-card" method="POST">
            <label>What are you sharing?</label>
            <select name="type">
                <option value="reach">Promoter (I have Social Media/Friends)</option>
                <option value="system">Provider (I have YouTube/Links/Offers)</option>
            </select>

            <label>Your Name or Handle:</label>
            <input type="text" name="name" required placeholder="e.g. Nazmiye or Cenk">

            <label>Your Reach or Target:</label>
            <input type="text" name="reach" required placeholder="e.g. 500 Real Friends or 1,000 Views">

            <label>Web Link:</label>
            <input type="url" name="link" required placeholder="https://...">

            <button type="submit">Post to Board</button>
        </form>
    </div>

    <h2>Live Whiteboard</h2>
    <div id="board-container">Loading live board...</div>

    <script>
        async function loadBoard() {
            try {
                const res = await fetch('/api/cards');
                const cards = await res.json();
                const container = document.getElementById('board-container');
                container.innerHTML = '';
                
                cards.forEach(card => {
                    const div = document.createElement('div');
                    div.className = 'card';
                    div.innerHTML = `
                        <strong>${card.type.toUpperCase()}</strong>
                        <h3>${card.name}</h3>
                        <p>${card.reach}</p>
                        <p><em>${card.meta || ''}</em></p>
                        <button onclick="trackAndOpen('${card.name.replace(/'/g, "\\'")}', '${card.link}')">Open Link & Verify</button>
                    `;
                    container.appendChild(div);
                });
            } catch (err) {
                console.error("Error loading cards:", err);
            }
        }

        async function trackAndOpen(taskName, targetUrl) {
            try {
                await fetch('/log_click', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        user_name: "Community Visitor", 
                        task_id: taskName 
                    })
                });
            } catch (err) {
                console.log("Ledger network note:", err);
            }
            window.open(targetUrl, '_blank');
        }

        loadBoard();
    </script>
</body>
</html>
