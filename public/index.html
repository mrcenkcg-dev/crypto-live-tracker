<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anadolu Island - Command Center</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #0b0b0b;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .command-container {
            width: 100%;
            max-width: 600px;
            background: #141414;
            border-radius: 16px;
            padding: 24px;
            border: 1px solid #262626;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #222;
            padding-bottom: 16px;
            margin-bottom: 24px;
        }
        .title {
            font-weight: 700;
            font-size: 16px;
            letter-spacing: 1px;
        }
        .status-badge {
            font-size: 10px;
            font-weight: 700;
            background: #34c759;
            color: #ffffff;
            padding: 4px 8px;
            border-radius: 4px;
        }
        .nav-section {
            margin-top: 20px;
        }
        .nav-label {
            font-size: 13px;
            color: #888;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .nav-buttons {
            display: flex;
            gap: 12px;
        }
        .platform-btn {
            flex: 1;
            background: #1f1f1f;
            color: #ffffff;
            border: 1px solid #333;
            padding: 16px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            text-decoration: none;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        .platform-btn:hover {
            background: #2a2a2a;
            border-color: #555;
        }
        .btn-icon {
            font-size: 20px;
        }
        .logs-box {
            margin-top: 24px;
            background: #0f0f0f;
            border-radius: 8px;
            padding: 12px;
            border: 1px solid #222;
            font-family: monospace;
            font-size: 12px;
            color: #aaa;
        }
    </style>
</head>
<body>

    <div class="command-container">
        <!-- Header -->
        <div class="header">
            <span class="title">ANADOLU ISLAND COMMAND</span>
            <span class="status-badge">ONLINE</span>
        </div>

        <!-- Navigation Hub -->
        <div class="nav-section">
            <div class="nav-label">Platform Streams</div>
            <div class="nav-buttons">
                <!-- Short-Form Stream Link -->
                <a href="/shorts" class="platform-btn">
                    <span class="btn-icon">⚡</span>
                    <span>Shorts Stream</span>
                </a>
                
                <!-- Long-Form Sanctuary Link -->
                <a href="/sanctuary" class="platform-btn">
                    <span class="btn-icon">🏛️</span>
                    <span>Long-Form Sanctuary</span>
                </a>
            </div>
        </div>

        <!-- System Logs Preview -->
        <div class="logs-box">
            [System] Core operational. Autonomous harvesting loop active.<br>
            [Render] Port 10000 listening successfully.
        </div>
    </div>

</body>
</html>
