<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Crypto Market Tracker</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; }
    header { text-align: center; padding: 20px 0; border-bottom: 1px solid #334155; }
    h1 { color: #38bdf8; margin-bottom: 8px; }
    .ad-banner { background: #1e293b; border: 1px dashed #475569; text-align: center; padding: 25px; margin: 20px 0; border-radius: 8px; color: #94a3b8; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #1e293b; border-radius: 8px; overflow: hidden; }
    th, td { padding: 14px; text-align: left; border-bottom: 1px solid #334155; }
    th { background-color: #0f172a; color: #94a3b8; font-weight: 600; }
    .positive { color: #4ade80; font-weight: bold; }
    .negative { color: #f87171; font-weight: bold; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Live Crypto Tracker</h1>
      <p>Real-time updates auto-refreshed directly from market feeds</p>
    </header>

    <!-- CPM AD SLOT TOP -->
    <div class="ad-banner">
      <small>[ CPM Ad Banner - Network Integration Slot 1 ]</small>
    </div>

    <table>
      <thead>
        <tr>
          <th>Asset</th>
          <th>Symbol</th>
          <th>Price (USD)</th>
          <th>24h Change</th>
        </tr>
      </thead>
      <tbody id="crypto-table-body">
        <tr><td colspan="4" style="text-align: center;">Loading market data...</td></tr>
      </tbody>
    </table>

    <!-- CPM AD SLOT BOTTOM -->
    <div class="ad-banner">
      <small>[ CPM Ad Banner - Network Integration Slot 2 ]</small>
    </div>
  </div>

  <script>
    async function loadPrices() {
      try {
        const res = await fetch('/api/prices');
        const json = await res.json();
        const tbody = document.getElementById('crypto-table-body');
        tbody.innerHTML = '';

        json.data.forEach(coin => {
          const changeClass = coin.change_24h >= 0 ? 'positive' : 'negative';
          const changeSign = coin.change_24h >= 0 ? '+' : '';
          const row = `
            <tr>
              <td><strong>${coin.name}</strong></td>
              <td>${coin.symbol}</td>
              <td>$${coin.price_usd.toLocaleString()}</td>
              <td class="${changeClass}">${changeSign}${coin.change_24h.toFixed(2)}%</td>
            </tr>
          `;
          tbody.innerHTML += row;
        });
      } catch (err) {
        console.error('Failed fetching live prices:', err);
      }
    }

    loadPrices();
    setInterval(loadPrices, 30000); // UI updates every 30 seconds
  </script>
</body>
</html>
