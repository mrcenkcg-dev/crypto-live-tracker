<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shoulder to Shoulder</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #f3f4f6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: #1f2937;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            text-align: center;
            border: 1px solid #374151;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 15px;
            color: #ffffff;
            letter-spacing: -0.5px;
        }
        p {
            color: #9ca3af;
            font-size: 1rem;
            line-height: 1.5;
            margin-bottom: 30px;
        }
        .status-badge {
            display: inline-flex;
            align-items: center;
            background: rgba(16, 185, 129, 0.1);
            color: #34d399;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 30px;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }
        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #34d399;
            border-radius: 50%;
            margin-right: 8px;
            box-shadow: 0 0 8px #34d399;
        }
        .action-box {
            background: #111827;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #374151;
        }
        .btn {
            display: inline-block;
            background: #3b82f6;
            color: white;
            font-weight: 600;
            padding: 12px 24px;
            border-radius: 6px;
            text-decoration: none;
            transition: background 0.2s;
            width: 100%;
            border: none;
            cursor: pointer;
            font-size: 1rem;
        }
        .btn:hover {
            background: #2563eb;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="status-badge">
            <span class="status-dot"></span> System Online & Active 24/7
        </div>
        
        <h1>Shoulder to Shoulder</h1>
        <p>Automated digital publishing ecosystem. Autonomous background workflows operating continuously.</p>
        
        <div class="action-box">
            <button class="btn" onclick="alert('System ready for participant connection.')">Join Platform</button>
        </div>
    </div>

</body>
</html>
