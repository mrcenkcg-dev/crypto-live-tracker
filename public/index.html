<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Engine - Live Portal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        h1 { color: #38bdf8; text-align: center; }
        .stats-box {
            display: flex;
            justify-content: space-around;
            background: #334155;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }
        .stat-item { text-align: center; }
        .stat-value { font-size: 24px; font-weight: bold; color: #34d399; }
        .slot-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 10px;
            margin-top: 20px;
        }
        .slot {
            background: #475569;
            padding: 15px;
            text-align: center;
            border-radius: 6px;
            font-size: 14px;
        }
        .slot.active { background: #0284c7; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Community Engine Portal</h1>
        <p style="text-align: center; color: #94a3b8;">Fair rotation network: Max 10 active slots per participant.</p>

        <div class="stats-box">
            <div class="stat-item">
                <div>Free Tier Limit</div>
                <div class="stat-value">1,500</div>
            </div>
            <div class="stat-item">
                <div>User Slot Cap</div>
                <div class="stat-value">10 / user</div>
            </div>
            <div class="stat-item">
                <div>Test Window</div>
                <div class="stat-value">7 Days</div>
            </div>
        </div>

        <h3>Active Rotation Slots (Sample View)</h3>
        <div class="slot-grid" id="slotContainer">
            <!-- Slots populated dynamically -->
        </div>
    </div>

    <script>
        // Core Business Rules Configuration
        const CONFIG = {
            maxFreeSlots: 1500,
            microFeeEntry: 0.50, // 50p toll starting at 1501
            userSlotLimit: 10,   // Strict cap per participant
            testWindowDays: 7
        };

        function evaluateRegistration(currentCount) {
            if (currentCount <= CONFIG.maxFreeSlots) {
                return { 
                    status: "FREE_TIER", 
                    fee: 0.00, 
                    remainingFree: CONFIG.maxFreeSlots - currentCount 
                };
            } else {
                return { 
                    status: "MICRO_FEE_ACTIVE", 
                    fee: CONFIG.microFeeEntry, 
                    notice: "Community maintenance toll engaged." 
                };
            }
        }

        // Render sample active slots to verify visual layout
        const container = document.getElementById('slotContainer');
        for (let i = 1; i <= 10; i++) {
            const div = document.createElement('div');
            div.className = 'slot active';
            div.innerText = `Slot #${i} (Active)`;
            container.appendChild(div);
        }
    </script>

</body>
</html>
