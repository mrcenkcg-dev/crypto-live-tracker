<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shoulder to Shoulder - Live Platform Counters</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 800px;
            width: 100%;
            text-align: center;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #ffffff;
        }
        p.subtitle {
            color: #94a3b8;
            font-size: 1.1rem;
            margin-bottom: 40px;
        }
        .counters-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .card h3 {
            margin: 0 0 10px 0;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #94a3b8;
        }
        .card .count {
            font-size: 2.5rem;
            font-weight: 700;
            color: #38bdf8;
            margin: 0;
        }
        .status-box {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 15px;
            font-size: 0.9rem;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Shoulder to Shoulder</h1>
        <p class="subtitle">Live Activity & Channel Counters</p>

        <div class="counters-grid">
            <div class="card">
                <h3>YouTube</h3>
                <p class="count" id="stat-youtube">0</p>
            </div>
            <div class="card">
                <h3>TikTok</h3>
                <p class="count" id="stat-tiktok">0</p>
            </div>
            <div class="card">
                <h3>Instagram</h3>
                <p class="count" id="stat-instagram">0</p>
            </div>
            <div class="card">
                <h3>Facebook</h3>
                <p class="count" id="stat-facebook">0</p>
            </div>
            <div class="card">
                <h3>Reddit</h3>
                <p class="count" id="stat-reddit">0</p>
            </div>
        </div>

        <div class="status-box">
            System Status: <span id="status-text" style="color: #4ade80;">Connected & Live</span>
        </div>
    </div>

    <script>
        async function fetchStats() {
            try {
                const response = await fetch('/api/stats');
                const data = await response.json();
                
                document.getElementById('stat-youtube').textContent = data.youtube || 0;
                document.getElementById('stat-tiktok').textContent = data.tiktok || 0;
                document.getElementById('stat-instagram').textContent = data.instagram || 0;
                document.getElementById('stat-facebook').textContent = data.facebook || 0;
                document.getElementById('stat-reddit').textContent = data.reddit || 0;
            } catch (error) {
                console.error('Error fetching stats:', error);
                document.getElementById('status-text').textContent = 'Sync Error';
                document.getElementById('status-text').style.color = '#f87171';
            }
        }

        // Fetch immediately on load, then every 5 seconds
        fetchStats();
        setInterval(fetchStats, 5000);
    </script>
</body>
</html>
