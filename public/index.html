<script>
        // Fetch registered studio assets from the backend API
        fetch('/api/intelligence')
            .then(response => response.json())
            .then(data => {
                const tbody = document.getElementById('asset-table-body');
                if (data && data.data && data.data.length > 0) {
                    tbody.innerHTML = '';
                    data.data.forEach(item => {
                        tbody.innerHTML += `
                            <tr>
                                <td><b>${item.asset_title || 'Untitled Asset'}</b></td>
                                <td style="color: #38bdf8;">${item.file_path || '/path/unknown'}</td>
                                <td><span class="badge">${item.category || 'General'}</span></td>
                                <td>${item.created_at || 'Just now'}</td>
                            </tr>
                        `;
                    });
                } else {
                    tbody.innerHTML = '<tr><td colspan="4" style="color: #94a3b8; text-align: center;">Studio online. Ready for your first worker script or asset upload.</td></tr>';
                }
            })
            .catch(err => {
                const tbody = document.getElementById('asset-table-body');
                tbody.innerHTML = '<tr><td colspan="4" style="color: #ef4444; text-align: center;">Waiting for telemetry sync...</td></tr>';
            });
    </script>
